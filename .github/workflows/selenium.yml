name: Selenium Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
      - feature/**
  workflow_dispatch:
    inputs:
      base_url:
        description: "Website URL to test"
        required: false
        default: "https://qainterview.netlify.app/"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  selenium:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://qainterview.netlify.app/' }}
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare Selenium report directory
        run: mkdir -p Selenium/report
      - name: Run Selenium tests
        run: >-
          python -m pytest Selenium/tests/testcase1.py -v
          --junitxml=Selenium/report/selenium-junit.xml
      - name: Upload Selenium artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: selenium-artifacts-${{ github.run_id }}
          path: Selenium/report/
          if-no-files-found: warn
          retention-days: 30
